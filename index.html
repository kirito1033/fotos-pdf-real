<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto a PDF</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Foto a PDF</h1>
      <p>Toma fotos desde tu Android y genera un PDF en el PC.</p>
    </header>

    <section class="camera-card">
      <!-- Ya NO hay video ni canvas aquí -->
      <div id="qrContainer" style="text-align:center; margin-top:16px;">
        <p>Escanea este código con tu Android para tomar fotos</p>
        <canvas id="qr"></canvas>
      </div>

      <div class="controls">
        <button id="startPeerBtn" class="btn primary">Nuevo QR</button>
        <button id="captureBtn" class="btn" disabled>Pedir foto</button>
        <button id="stopPeerBtn" class="btn danger" disabled>Desconectar</button>
      </div>

      <div class="pdf-actions">
        <button id="generatePdfBtn" class="btn success" disabled>Generar PDF</button>
        <button id="clearPhotosBtn" class="btn secondary" disabled>Limpiar fotos</button>
      </div>

      <p id="status" class="status">Estado: esperando conexión del celular</p>
    </section>

    <section class="gallery-card">
      <div class="gallery-header">
        <h2>Fotos</h2>
        <span id="photoCount">0 fotos</span>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
