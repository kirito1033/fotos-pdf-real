<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEFONE Mobile Camera</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 16px;
    }
    video {
      width: 100%;
      border-radius: 14px;
      background: #000;
      aspect-ratio: 3/4;
      object-fit: cover;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
    }
    p {
      margin-top: 12px;
      color: #ddd;
    }
  </style>
</head>
<body>
  <h2>WEFONE móvil</h2>
  <video id="video" autoplay playsinline muted></video>
  <button id="captureBtn" disabled>Tomar y enviar foto</button>
  <p id="status">Estado: iniciando...</p>
  <script src="mobile.js"></script>
</body>
</html>
